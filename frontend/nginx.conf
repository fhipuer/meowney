server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅 지원
    location / {
        # Do not probe directories here. The React route `/assets` otherwise
        # collides with Vite's physical `assets/` directory and returns a 404
        # instead of the SPA entry point on refresh or direct navigation.
        try_files $uri $uri.html /index.html;
    }

    # API 프록시 (필요시)
    location /api {
        proxy_pass http://meowney-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 정적 파일 캐싱
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
